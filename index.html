<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyógyszerkereső</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #fff; color: #1b2421; max-width: 600px; margin: auto; padding: 16px; }
  #allapot { color: #5b6b66; }
</style>
</head>
<body>
<h1>Gyógyszerkereső</h1>
<label for="q">Hatóanyag vagy márkanév (próbáld: „x” = szerverhiba)</label>
<input id="q" autocomplete="off">
<p id="allapot" aria-live="polite"></p>
<ul id="talalatok"></ul>
<button id="frissit" type="button">Automatikus frissítés</button>
<p>Találatok listaáron összesen: <output id="osszeg">0</output> lej</p>
<script>
const ADAT = ['Algopyrin', 'Aspirin', 'Amoxicillin', 'Augmentin', 'Algoflex', 'Betaloc', 'Cataflam', 'Cetirizin', 'Diclofenac'];
// Szimulált szerver: a rövidebb (általánosabb) keresés lassabban válaszol
function fakeFetch(q) {
  console.log('Keresés indult: ' + q);  
  return new Promise((resolve, reject) => {
    const kesleltetes = Math.max(50, 1200 - q.length * 250 + Math.random() * 200);
    setTimeout(() => {
      if (q === 'x') return reject(new Error('Szerverhiba (503)'));
      resolve(ADAT.filter(n => n.toLowerCase().startsWith(q.toLowerCase())));
    }, kesleltetes);
    console.log('Keresés: ' + q + ', válaszidő: ' + kesleltetes.toFixed(0) + ' ms');
  });
}
function fakePrice(nev) {
  return new Promise(r => setTimeout(() => r(10 + nev.length), 100 + Math.random() * 300));
}
const input = document.getElementById('q');
const allapot = document.getElementById('allapot');

let utolsoKeres = 0;
let debounceId;


input.addEventListener('input', () => {
  clearTimeout(debounceId);
  
  debounceId = setTimeout(() => {
    const q = input.value.trim();
    const keresettId = ++utolsoKeres;
    
    allapot.textContent = 'Keresés…';

    fakeFetch(q)
      .then(nevek => {
        if (keresettId !== utolsoKeres) return; // elavult keresés
        megjelenit(nevek);
      })
      .catch(e => {
        // Itt kapjuk el az aszinkron szerverhibát!
        if (keresettId !== utolsoKeres) return; // elavult keresés
        allapot.textContent = 'Hiba: ' + e.message;
        document.getElementById('talalatok').textContent = '';
        document.getElementById('osszeg').textContent = '0';
      });
  }, 300);
});
    
function megjelenit(nevek) {
  const ul = document.getElementById('talalatok');
  ul.textContent = '';
  nevek.forEach(n => {
    const li = document.createElement('li');
    li.textContent = n;
    ul.appendChild(li);
  });
  allapot.textContent = nevek.length + ' találat';
  osszesit(nevek);
}

async function osszesit(nevek) {
  if (nevek.length === 0) {
    document.getElementById('osszeg').textContent = '0';
    return;
  }

  //Promises.all() várja az összes ár lekérését, majd összeadja azokat
  const arak = await Promise.all(nevek.map(n => fakePrice(n)));

  const osszeg = arak.reduce((a, b) => a + b, 0); // Összeadjuk az árakat reduce() segítségével
  
  document.getElementById('osszeg').textContent = osszeg;
}

document.getElementById('frissit').addEventListener('click', () => {
  setInterval(() => {
    fakeFetch(input.value.trim()).then(megjelenit);
  }, 2000);
});
</script>
</body>
</html>
